[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdcc-rag"
version = "0.1.0"
description = "Sistema RAG sul corpus SDCC (ingestion pipeline interface-driven)"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.30",
    "ollama>=0.3",
    "pydantic-settings>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
